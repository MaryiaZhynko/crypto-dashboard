services:
  ticker-service:
    build: .
    container_name: crypto-ticker-service
    restart: unless-stopped
    networks:
      - crypto-net
    ports:
      - '4445:4445'
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
    command:
      ['pnpm', 'run', 'start:dev:ticker']
    environment:
      TICKER_LISTEN_HOST: '0.0.0.0'
      TICKER_LISTEN_PORT: '4445'

  backend:
    build: .
    container_name: crypto-backend
    restart: unless-stopped
    depends_on:
      - ticker-service
    networks:
      crypto-net:
        aliases:
          # Resolves inside the stack; on the host, *.localhost → 127.0.0.1 in most browsers.
          - backend.localhost
    ports:
      - '4444:4444'
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
    command:
      ['pnpm', 'run', 'start:dev']
    environment:
      PORT: '4444'
      TICKER_SERVICE_HOST: ticker-service
      TICKER_SERVICE_PORT: '4445'

  frontend:
    build: .
    container_name: crypto-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - crypto-net
    ports:
      - '5173:5173'
    working_dir: /usr/src/app
    environment:
      CI: 'true'
      VITE_TICKER_API_URL: 'http://backend.localhost:4444'
      VITE_TICKER_WS_URL: 'ws://backend.localhost:4444/ws/tickers'
    volumes:
      - .:/usr/src/app
      - frontend_node_modules:/usr/src/app/node_modules
    command:
      [
        'sh',
        '-c',
        'pnpm install --frozen-lockfile && pnpm run dev:frontend',
      ]

networks:
  crypto-net:
    driver: bridge

volumes:
  frontend_node_modules: